name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes (núcleo não depende de PySide6)
        run: python -m unittest discover -s tests -t . -v
  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pyinstaller --noconfirm --windowed --name PS2Native --collect-submodules ps2native run_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: PS2Native-windows
          path: dist/PS2Native
